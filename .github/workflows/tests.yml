name: Tests

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Install uv
      uses: astral-sh/setup-uv@v5

    - name: Set up Python
      run: uv python install 3.12

    - name: Install dependencies
      run: uv sync

    - name: Run tests
      run: uv run python src/test_runner.py
      env:
        DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN || 'mock_discord_token' }}
        GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || 'mock_gemini_api_key' }}
