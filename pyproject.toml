[project]
name = "discordbot"
version = "0.1.0"
description = ""
authors = [{name = "yootako", email = "yootako03@gamil.com"}]
requires-python = ">=3.12"

dependencies = [
    "requests>=2.32.3",
    "yt-dlp>=2024.11.4",
    "python-dotenv>=1.0.1",
    "discord-py[voice]>=2.7.1",
    "google-genai>=1.14.0",
    "aiosqlite>=0.20.0",
    "aiohttp>=3.9.0",
]

[dependency-groups]
dev = [
    "pytest>=7.4.0",
    "pytest-asyncio>=0.23.0",
    "pytest-cov>=4.1.0",
]

[tool.pytest.ini_options]
testpaths = ["src"]
python_files = "*_test.py"
python_functions = "test_*"
